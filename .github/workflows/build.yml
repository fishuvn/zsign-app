name: Build App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "zsignapp/**"
      - "ZSShareExtension/**"
      - "Zsign/**"
      - "AltSourceKit/**"
      - "zsignapp.xcodeproj/**"
      - "Makefile"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Liquid Glass UI (glassEffect) needs the iOS 26 SDK, so use the
      # newest Xcode on the image instead of pinning an older version.
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Compile zsignapp
        run: |
          make
          ls -lh packages/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: zsignapp-ipa
          path: packages/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Read app version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/*.app/Info.plist)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # One published release per successful build; the run number keeps
      # tags unique when the marketing version is unchanged.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: zsignapp v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          files: packages/*.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
